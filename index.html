<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Fotoselectie</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#2b2a28;--muted:#77736c;--line:#e2ddd4;--accent:#4a5a6a}
@media (prefers-color-scheme: dark){:root{--bg:#1c1b1a;--card:#262523;--ink:#ece8e1;--muted:#a19c93;--line:#3a3835;--accent:#9fb3c8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
main{max-width:480px;margin:10vh auto;padding:0 16px}
h1{font-weight:500;font-size:22px;margin:0 0 8px}
p{color:var(--muted)}
a.keuze{display:block;margin:12px 0;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-size:17px}
a.keuze:hover{border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Fotoselectie</h1>
  <p>Kies voor welke uitvaart je foto's wilt bekijken en kiezen.</p>
  <!-- per uitvaart een eigen adres; elk adres moet als Redirect URI in de Dropbox-app staan -->
  <a class="keuze" href="ria/">Uitvaart Ria</a>
  <a class="keuze" href="jan/">Uitvaart Jan</a>
</main>
</body>
</html>
